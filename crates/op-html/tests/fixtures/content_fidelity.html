<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content fidelity fixture</title>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        src: url("/fonts/inter.woff2") format("woff2");
      }
      @font-face {
        font-family: "Never Used";
        src: url("/fonts/never.woff2") format("woff2");
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
      }

      /* B12: cover + centred position is exactly the Fill placement. */
      .hero {
        width: 1200px;
        height: 420px;
        background-image: url("hero.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      /* B12: an explicit size + offset is an exact crop transform. */
      .badge {
        width: 200px;
        height: 100px;
        background-image: url("badge.png");
        background-size: 100px 50px;
        background-position: 25px 10px;
        background-repeat: no-repeat;
      }

      /* B13: first shadow wins, the rest are reported. */
      .hero-title {
        font-size: 48px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), 0 0 20px #ff0000;
      }

      /* B13: `auto` establishes a scroll container, so it clips. */
      .scroller {
        width: 320px;
        height: 160px;
        overflow: auto;
      }

      /* B8 */
      .roman {
        list-style-type: lower-roman;
      }

      /* B9 */
      .pricing {
        width: 900px;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1 class="hero-title">Ship faster</h1>
    </section>

    <div class="badge"></div>

    <nav>
      <ul>
        <li>Top level</li>
        <li>
          Has children
          <ul>
            <li>Nested one</li>
            <li>Nested two</li>
          </ul>
        </li>
      </ul>

      <ol start="3">
        <li>Third</li>
        <li value="9">Ninth</li>
        <li>Tenth</li>
      </ol>

      <ol class="roman">
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
        <li>Four</li>
      </ol>
    </nav>

    <table class="pricing">
      <caption>
        Plans
      </caption>
      <colgroup>
        <col />
        <col />
        <col />
      </colgroup>
      <thead>
        <tr>
          <th colspan="2">Included</th>
          <th>Enterprise</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Seats</td>
          <td>10</td>
          <td>Unlimited</td>
        </tr>
        <tr>
          <td>Support</td>
          <td>Email</td>
          <td>24/7</td>
        </tr>
      </tbody>
    </table>

    <picture>
      <source media="(max-width: 640px)" srcset="phone-480.jpg 480w" />
      <source type="image/avif" srcset="modern-1600.avif 1600w" />
      <source srcset="wide-800.jpg 800w, wide-1600.jpg 1600w" />
      <img src="fallback.jpg" alt="Product" />
    </picture>

    <div class="scroller">Scrolling body copy.</div>
  </body>
</html>
