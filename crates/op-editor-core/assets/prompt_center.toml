title_fallback = "Orbit · AI 工作台官网"
body_zh = '''设计 Orbit AI 工作台的响应式桌面落地页：精简导航、分屏 Hero（明确价值主张、产品界面视觉和双 CTA）、客户品牌、三段能力叙事、工作流图、客户证言、两档定价、FAQ 和末尾 CTA。审美为编辑感企业科技：暖白、墨黑、电光钴蓝、精确排版和克制的动效暗示；避免泛滥的渐变光球。'''
body_en = '''Design a responsive desktop landing page for Orbit, an AI workbench: a slim nav; split hero with a precise value proposition, product UI visual and two CTAs; customer logos; three capability stories; workflow diagram; customer proof; two pricing tiers; FAQ; and a final CTA. Aesthetic: editorial enterprise tech—warm white, ink black, electric cobalt, crisp type and restrained motion cues; avoid generic gradient blobs.'''
screens = 1

[[prompt]]
id = "web-atelier"
