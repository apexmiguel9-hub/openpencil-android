[[prompt]]
id = "freeform-forage"
category = "mobile-app"
tags = ["gallery", "freeform", "food"]
title_key = "promptCenter.item.forage.title"
title_fallback = "Forage · 时令菜谱"
body_zh = '''设计 Forage 时令菜谱 App 的首页。布局、配色、风格全由你决定,拿出最好的水平。'''
body_en = '''Design the home screen of Forage, a seasonal recipe app. Layout, color, and style are entirely your call — show me your best.'''

